# Merge these pieces into your existing compose.yml (this file is not meant to be run on its own).

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: backlinks
      POSTGRES_USER: backlinks
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"   # optional, only for psql / DBeaver from this machine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backlinks -d backlinks"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    # keep everything you already have, and add:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # already present
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      # new
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - REVIEW_BASE_URL=${REVIEW_BASE_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - BLUESKY_HANDLE=${BLUESKY_HANDLE}
      - BLUESKY_APP_PASSWORD=${BLUESKY_APP_PASSWORD}

# n8n credential to create in the UI (Credentials > Postgres):
#   Host: postgres    Port: 5432    Database: backlinks    User: backlinks    Password: <POSTGRES_PASSWORD>
# n8n keeps using its own SQLite for workflows. This Postgres only stores backlink candidates.
